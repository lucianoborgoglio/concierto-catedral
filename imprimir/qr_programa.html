<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>QR Programa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400&display=block" rel="stylesheet">
<style>
  /* A4 vertical, solo tinta negra sobre blanco: simple y barato de imprimir. */
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .sheet { width: 210mm; height: 297mm; margin: 0 auto; display: flex; flex-direction: column;
           align-items: center; justify-content: center; text-align: center;
           background: #fff; color: #000; font-family: Newsreader, serif; }
  h1 { font-weight: 300; font-size: 54pt; letter-spacing: .14em; margin-right: -.14em; line-height: 1; }
  img { display: block; width: 130mm; height: 130mm; margin-top: 14mm; }
  .url { margin-top: 10mm; font-size: 16pt; letter-spacing: .02em; }
</style>
</head>
<body>
<div class="sheet">
  <h1>PROGRAMA</h1>
  <img src="../qr/qr_negro.svg" alt="Código QR del programa">
  <p class="url">lucianoborgoglio.github.io/concierto-catedral</p>
</div>
</body>
</html>
